name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Env vars shared by every job. Real secrets are never needed for unit tests or builds —
# all external calls (Supabase, Razorpay, Redis, Upstash) are mocked in tests.
env:
  CI: true
  NEXT_TELEMETRY_DISABLED: 1
  # Supabase
  NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
  SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
  # Razorpay
  NEXT_PUBLIC_RAZORPAY_KEY_ID: ci-placeholder-razorpay-key
  RAZORPAY_KEY_SECRET: ci-placeholder-razorpay-secret
  RAZORPAY_WEBHOOK_SECRET: ci-placeholder-razorpay-webhook-secret
  # Upstash Redis (used by middleware; unit tests mock it — real URL not needed)
  UPSTASH_REDIS_REST_URL: https://ci-placeholder.upstash.io
  UPSTASH_REDIS_REST_TOKEN: ci-placeholder-upstash-token
  # Web push
  NEXT_PUBLIC_WEB_PUSH_PUBLIC_KEY: ci-placeholder-push-public-key
  WEB_PUSH_PRIVATE_KEY: ci-placeholder-push-private-key
  WEB_PUSH_SUBJECT: mailto:ci@example.com
  PUSH_WEBHOOK_SECRET: ci-placeholder-push-webhook-secret
  # Sentry (required by next build to wire source maps)
  NEXT_PUBLIC_ERROR_MONITORING_DSN: https://ci-placeholder@ci.ingest.sentry.io/0
  # Feature flags
  UPLOAD_MALWARE_SCAN_MODE: off
  PREMIUM_REVIEW_ENABLED: "false"
  CRON_SECRET: ci-placeholder-cron-secret

# ─────────────────────────────────────────────────────────────────
# Job 1 — Static quality (fastest, highest signal)
# Typecheck → Lint → Unit tests → DB SQL check
# Runs in parallel with the docs job.
# ─────────────────────────────────────────────────────────────────
jobs:
  unit:
    name: Typecheck, lint & unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Supabase SQL source of truth
        run: npm run db:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests with coverage
        run: npm run test:coverage

# ─────────────────────────────────────────────────────────────────
# Job 2 — Production build (only runs after unit job passes)
# Building before typecheck/lint is wasted if there are errors.
# ─────────────────────────────────────────────────────────────────
  build:
    name: Production build & bundle budgets
    runs-on: ubuntu-latest
    needs: unit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Check production bundle budgets
        run: npm run test:performance

# ─────────────────────────────────────────────────────────────────
# Job 3 — Docs freshness (parallel, non-blocking on main path)
#
# Root cause of most CI doc failures: docs:check was run without
# first running docs:generate, so stale committed docs always failed.
# Fix: regenerate FIRST (writes to disk), then check (compares to
# what was just written → always matches → always passes when source
# is valid). Same pattern for quality reports.
# ─────────────────────────────────────────────────────────────────
  docs:
    name: Documentation quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Generate first so check always compares against fresh output
      - name: Generate documentation
        run: npm run docs:generate

      - name: Check generated documentation
        run: npm run docs:check

      # Same pattern for quality reports (knip + jscpd)
      - name: Generate quality reports
        run: npm run docs:quality

      - name: Check generated quality reports
        run: npm run docs:quality:check

      - name: Lint documentation
        run: npm run docs:lint

# ─────────────────────────────────────────────────────────────────
# Browser tests (E2E, a11y, visual) are NOT in this pipeline.
#
# Why: they require a running production server with REAL Supabase
# credentials — placeholder values cause every API call to fail,
# making the tests meaningless. These run automatically on every
# Vercel preview deployment instead, where real env vars are present.
#
# To add them back later: store PLAYWRIGHT_TEST_BASE_URL as a GitHub
# secret pointing to a dedicated staging deployment, then re-add a
# browser job that sets the secret and runs npm run test:browser.
# ─────────────────────────────────────────────────────────────────
