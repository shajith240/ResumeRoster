name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Test, typecheck, lint, and build
    runs-on: ubuntu-latest

    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      NEXT_PUBLIC_WEB_PUSH_PUBLIC_KEY: ci-placeholder-public-key
      WEB_PUSH_PRIVATE_KEY: ci-placeholder-private-key
      WEB_PUSH_SUBJECT: mailto:ci@example.com
      PUSH_WEBHOOK_SECRET: ci-placeholder-webhook-secret
      UPLOAD_MALWARE_SCAN_MODE: off

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install browser dependencies
        run: npx playwright install --with-deps chromium

      - name: Check Supabase SQL source of truth
        run: npm run db:check

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Check generated documentation
        run: npm run docs:check

      - name: Check generated quality reports
        run: npm run docs:quality:check

      - name: Lint documentation
        run: npm run docs:lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run lint
        run: npm run lint

      - name: Build production bundle
        run: npm run build

      - name: Check production bundle budgets
        run: npm run test:performance

      - name: Run E2E browser tests
        run: npm run test:e2e

      - name: Run accessibility browser tests
        run: npm run test:a11y

      - name: Run responsive visual layout tests
        run: npm run test:visual
